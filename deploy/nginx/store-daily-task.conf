# Reverse proxy: public :80/:443  ->  Next.js on 127.0.0.1:3000
#
# Install:
#   sudo cp deploy/nginx/store-daily-task.conf /etc/nginx/sites-available/store-daily-task
#   sudo ln -s /etc/nginx/sites-available/store-daily-task /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
# certbot rewrites this file to add the 443 server block and redirect.

upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;   # <-- change me (or use the server IP for now)

    # Upload headroom for task-image / xlsx endpoints
    client_max_body_size 25M;

    # Next.js static assets — immutable, cache hard
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # BC import / xlsx endpoints can be slow
        proxy_buffering off;
    }
}
