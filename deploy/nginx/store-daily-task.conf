# PRISM — reverse proxy for prism.panatradeprestasi.com
# Public :80/:443  ->  Next.js on 127.0.0.1:3000 (PM2 "store-daily-task")
#
# Built from the live server config (Oct 2026), plus:
#   • rate limits on sign-in and on the public "Lupa password" API
#   • keep-alive to Next.js that is actually used: "Connection: upgrade" only goes
#     out on real websocket requests (always sending it closed every upstream connection)
#   • TLS 1.2/1.3 only, TLS session cache, HTTP/2
#   • nginx version hidden; no duplicate Cache-Control on /_next/static
#
# Install / update on the server:
#   sudo cp deploy/nginx/store-daily-task.conf /etc/nginx/sites-available/<this site's file>
#   sudo nginx -t && sudo systemctl reload nginx        # -t first: a typo never goes live
#
# TLS uses the company certificate in /etc/ssl/panatradeprestasi.com/ (not certbot).
# Security headers (CSP, HSTS, nosniff, frame-ancestors, Referrer-Policy …) come from
# the app (proxy.ts) — don't add them here as well, or browsers get two copies.

# ── http{} level ──────────────────────────────────────────────────────────────
# sites-enabled files are included inside http{}, so these top-level lines are
# valid. Everything is prefixed sdt_ so it can't clash with another site's zone
# or variable on this server (a duplicate name makes `nginx -t` fail).

# Per client IP. Staff in one store share the store Wi-Fi's IP, so the bursts leave
# room for a whole shift signing in at once. The app throttles per NIK as well
# (lib/auth/rate-limit.ts, lib/auth/throttle.ts).
limit_req_zone $binary_remote_addr zone=sdt_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sdt_reset:10m rate=6r/m;

map $http_upgrade $sdt_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream sdt_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── :80 → https ───────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name prism.panatradeprestasi.com;
    server_tokens off;

    return 301 https://$host$request_uri;
}

# ── :443 ──────────────────────────────────────────────────────────────────────

server {
    # On nginx ≥ 1.25.1 `nginx -t` warns that "http2" here is deprecated — it still
    # works; to silence it, remove "http2" from both lines and add `http2 on;` below.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prism.panatradeprestasi.com;
    server_tokens off;

    ssl_certificate     /etc/ssl/panatradeprestasi.com/panatradeprestasi.com.crt;
    ssl_certificate_key /etc/ssl/panatradeprestasi.com/panatradeprestasi.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:sdt_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Task photos, receipts, xlsx imports, PDF manuals.
    client_max_body_size 120M;

    # Proxy settings for every location below. (nginx drops ALL inherited
    # proxy_set_header lines in a location that sets even one of its own — so keep
    # them here only.)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;   # the app's client IP (rate limits, audit)
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $sdt_connection_upgrade;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;   # BC sync / xlsx import-export can be slow

    # Next.js build assets (content-hashed). Next itself sends
    # "Cache-Control: public, max-age=31536000, immutable" for these.
    location /_next/static/ {
        proxy_pass http://sdt_upstream;
    }

    # Sign-in (NextAuth credentials).
    location = /api/auth/callback/credentials {
        limit_req zone=sdt_login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://sdt_upstream;
    }

    # "Lupa password" public API: request, link check, set new password.
    location ^~ /api/password-reset/ {
        limit_req zone=sdt_reset burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://sdt_upstream;
    }

    location / {
        proxy_pass http://sdt_upstream;
        proxy_buffering off;
    }
}
