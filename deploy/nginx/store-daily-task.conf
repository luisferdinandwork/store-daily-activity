# store-daily-task — reverse proxy for sdt.pri.co.id
# Public :80/:443 (server 103.94.239.190)  ->  Next.js on 127.0.0.1:3000
#
# Install:
#   sudo cp deploy/nginx/store-daily-task.conf /etc/nginx/sites-available/store-daily-task
#   sudo ln -s /etc/nginx/sites-available/store-daily-task /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS (certbot rewrites this file to add the :443 block + redirect):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d sdt.pri.co.id

# Brute-force brake on the sign-in endpoint: 10 requests/min per client IP (+ a burst of 10).
# The app ALSO throttles per NIK (lib/auth/rate-limit.ts); this layer stops one host early and
# keeps working if the app is ever scaled to several processes. Must live in the http{} context —
# sites-enabled files are included there, so a top-level directive here is fine.
limit_req_zone $binary_remote_addr zone=sdt_login:10m rate=10r/m;

upstream sdt_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name sdt.pri.co.id;

    # Don't leak the nginx version in headers / error pages.
    server_tokens off;

    # Upload headroom for task-image / xlsx endpoints
    client_max_body_size 25M;

    # Next.js build assets — content-hashed, safe to cache forever
    location /_next/static/ {
        proxy_pass http://sdt_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Credentials sign-in (NextAuth) — rate limited. Same proxy settings as `location /`.
    location = /api/auth/callback/credentials {
        limit_req zone=sdt_login burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://sdt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://sdt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # BC import / xlsx endpoints can be slow
        proxy_buffering off;
    }
}
